          write_file("README.md", f"""
          # TotemSnap (Minecraft Java 1.21.11 • Fabric)

          **TotemSnap** is a lightweight, responsive client-side Fabric utility mod for **Minecraft Java Edition {mc_ver}** that moves a **Totem of Undying** into your offhand with a single key press—without opening the inventory GUI and while safely preserving any existing offhand item (such as a Shield).

          ## Key Features
          - **One-Key AutoTotem (`TotemSnap Activate`):** Press your configured key once to move a Totem of Undying from your hotbar or main inventory into your offhand (`slot 45`).
          - **Zero Inventory GUI Opening:** Uses standard `ClientPlayerInteractionManager#clickSlot` transactions on `playerScreenHandler` without ever calling `setScreen`.
          - **Safe Offhand Preservation:** If you are holding a Shield or another item in your offhand, TotemSnap places it into the vacated Totem slot rather than overwriting or dropping items.
          - **Master Enable/Disable Toggle (`TotemSnap Enabled`):** Instantly enable or disable the mod from Mod Menu; disabling immediately clears any pending verification state.
          - **Configurable Missing Totem Alert:** Optionally displays `TotemSnap: No Totem found!` on the action bar when activated with no Totems in your inventory.
          - **Mod Menu Integration:** Dark-slate configuration screen with restrained cyan accents, keybind capture, restore defaults, and JSON persistence (`config/totemsnap.json`).

          ## Pinned Dependency Matrix
          | Component | Version |
          | :--- | :--- |
          | Minecraft | `{mc_ver}` |
          | Yarn Mappings | `{yarn_ver}` |
          | Fabric Loader | `{loader_ver}` |
          | Fabric API | `{fapi_ver}` |
          | Mod Menu (Optional) | `{modmenu_ver}` |
          | Java Toolchain | `JDK 21` |

          ## Server Compatibility & Fair Play Notice
          TotemSnap uses legitimate vanilla inventory slot interactions (`SlotActionType.SWAP` and `SlotActionType.PICKUP`) and respects server-authoritative inventory state. It does **not** fabricate packets, spoof acknowledgements, or implement anti-cheat bypasses. Please note that server-side plugins, custom inventory restrictions, high latency, or server rules may restrict automated slot interactions. Always check a server's rules before using inventory utility mods.
          """)
          PYEOF

      - name: Generate Gradle Wrapper Files
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type bin
          chmod +x ./gradlew
          test -f ./gradlew
          test -f ./gradle/wrapper/gradle-wrapper.jar
          test -f ./gradle/wrapper/gradle-wrapper.properties

      - name: Package Complete Source Project ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -r dist/TotemSnap-source.zip \
            .github \
            gradle \
            gradlew \
            gradlew.bat \
            settings.gradle \
            build.gradle \
            gradle.properties \
            src \
            README.md \
            LICENSE \
            .gitignore
          test -f dist/TotemSnap-source.zip

      - name: Run Unit Tests & Compile Mod with Gradle + Fabric Loom
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean test build --no-daemon --stacktrace

      - name: Verify Built JAR & Copy to dist/TotemSnap.jar
        shell: bash
        run: |
          set -euo pipefail
          test -f build/libs/TotemSnap.jar
          cp build/libs/TotemSnap.jar dist/TotemSnap.jar
          jar tf dist/TotemSnap.jar | grep -q "fabric.mod.json"
          jar tf dist/TotemSnap.jar | grep -q "dev/totemsnap/client/TotemSnapClient.class"
          echo "Verified TotemSnap.jar structure and metadata successfully."

      - name: Upload Compiled Mod JAR Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TotemSnap-jar
          path: dist/TotemSnap.jar
          if-no-files-found: error

      - name: Upload Complete Generated Source ZIP Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TotemSnap-source-zip
          path: dist/TotemSnap-source.zip
          if-no-files-found: error

      - name: Write GitHub Actions Build Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## TotemSnap Build Summary"
            echo ""
            echo "| Property | Value |"
            echo "| :--- | :--- |"
            echo "| **Mod Name** | \`${MOD_NAME}\` (\`${MOD_ID}\`) |"
            echo "| **Minecraft Version** | \`${MINECRAFT_VERSION}\` |"
            echo "| **Yarn Mappings** | \`${{ steps.resolve_deps.outputs.yarn_mappings }}\` |"
            echo "| **Fabric Loader** | \`${{ steps.resolve_deps.outputs.loader_version }}\` |"
            echo "| **Fabric API** | \`${{ steps.resolve_deps.outputs.fabric_api_version }}\` |"
            echo "| **Mod Menu** | \`${{ steps.resolve_deps.outputs.modmenu_version }}\` |"
            echo "| **Gradle / Java** | \`Gradle ${GRADLE_VERSION}\` / \`Temurin JDK 21\` |"
            echo "| **Compiled Artifact** | \`TotemSnap.jar\` |"
            echo "| **Source Archive** | \`TotemSnap-source.zip\` |"
          } >> "$GITHUB_STEP_SUMMARY"
