          write_file("src/test/java/dev/totemsnap/TotemSnapTest.java", """
          package dev.totemsnap;

          import dev.totemsnap.config.TotemSnapConfig;
          import dev.totemsnap.config.TotemSnapConfigManager;
          import dev.totemsnap.logic.InventorySnapshot;
          import dev.totemsnap.logic.SlotState;
          import dev.totemsnap.logic.SwapPlan;
          import dev.totemsnap.logic.SwapPlanner;
          import org.junit.jupiter.api.Test;
          import org.junit.jupiter.api.io.TempDir;

          import java.io.IOException;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.Arrays;

          import static org.junit.jupiter.api.Assertions.*;

          class TotemSnapTest {

              @Test
              void testMasterDisablePreventsAnySwap() {
                  SlotState[] slots = new SlotState[36];
                  Arrays.fill(slots, SlotState.EMPTY);
                  slots[2] = SlotState.TOTEM;

                  InventorySnapshot snapshot = new InventorySnapshot(slots, SlotState.EMPTY, true, 0);
                  SwapPlan plan = SwapPlanner.planSwap(snapshot, false, true);

                  assertEquals(SwapPlan.Outcome.DISABLED, plan.outcome());
                  assertTrue(plan.steps().isEmpty());
              }

              @Test
              void testAlreadyEquippedTotemDoesNotSwap() {
                  SlotState[] slots = new SlotState[36];
                  Arrays.fill(slots, SlotState.EMPTY);
                  slots[4] = SlotState.TOTEM;

                  InventorySnapshot snapshot = new InventorySnapshot(slots, SlotState.TOTEM, true, 0);
                  SwapPlan plan = SwapPlanner.planSwap(snapshot, true, true);

                  assertEquals(SwapPlan.Outcome.ALREADY_IN_OFFHAND, plan.outcome());
                  assertTrue(plan.steps().isEmpty());
              }

              @Test
              void testMissingTotemReportsNoTotemFound() {
                  SlotState[] slots = new SlotState[36];
                  Arrays.fill(slots, SlotState.OTHER);

                  InventorySnapshot snapshot = new InventorySnapshot(slots, SlotState.OTHER, true, 0);
                  SwapPlan plan = SwapPlanner.planSwap(snapshot, true, true);

                  assertEquals(SwapPlan.Outcome.NO_TOTEM_FOUND, plan.outcome());
                  assertTrue(plan.steps().isEmpty());
              }

              @Test
              void testHotbarTotemUsesAtomicSwapAndPreservesShieldInOffhand() {
                  SlotState[] slots = new SlotState[36];
                  Arrays.fill(slots, SlotState.OTHER);
                  slots[5] = SlotState.TOTEM;

                  // Offhand currently holds a Shield (SlotState.OTHER)
                  InventorySnapshot snapshot = new InventorySnapshot(slots, SlotState.OTHER, true, 0);
                  SwapPlan plan = SwapPlanner.planSwap(snapshot, true, true);

                  assertEquals(SwapPlan.Outcome.EXECUTE_SWAP, plan.outcome());
                  assertEquals(5, plan.sourceInventorySlot());
                  assertEquals(41, plan.sourceHandlerSlot());
                  assertEquals(1, plan.steps().size());

                  SwapPlan.ClickStep step = plan.steps().get(0);
                  assertEquals(InventorySnapshot.OFFHAND_HANDLER_SLOT, step.handlerSlot());
                  assertEquals(5, step.button());
                  assertEquals(SwapPlan.ActionKind.HOTBAR_SWAP, step.actionKind());
              }

              @Test
              void testMainInventoryTotemPreservesOffhandShieldWithThreeStepPickup() {
                  SlotState[] slots = new SlotState[36];
                  Arrays.fill(slots, SlotState.OTHER);
                  slots[14] = SlotState.TOTEM;

                  // Offhand holds a Shield (SlotState.OTHER), full inventory everywhere else
                  InventorySnapshot snapshot = new InventorySnapshot(slots, SlotState.OTHER, true, 0);
                  SwapPlan plan = SwapPlanner.planSwap(snapshot, true, true);

                  assertEquals(SwapPlan.Outcome.EXECUTE_SWAP, plan.outcome());
                  assertEquals(14, plan.sourceInventorySlot());
                  assertEquals(14, plan.sourceHandlerSlot());
                  assertEquals(3, plan.steps().size());

                  assertEquals(new SwapPlan.ClickStep(14, 0, SwapPlan.ActionKind.PICKUP_LEFT_CLICK), plan.steps().get(0));
                  assertEquals(new SwapPlan.ClickStep(45, 0, SwapPlan.ActionKind.PICKUP_LEFT_CLICK), plan.steps().get(1));
                  assertEquals(new SwapPlan.ClickStep(14, 0, SwapPlan.ActionKind.PICKUP_LEFT_CLICK), plan.steps().get(2));
              }

              @Test
              void testUnsafeCursorCancelsMainInventorySwap() {
                  SlotState[] slots = new SlotState[36];
                  Arrays.fill(slots, SlotState.EMPTY);
                  slots[20] = SlotState.TOTEM;

                  InventorySnapshot snapshot = new InventorySnapshot(slots, SlotState.OTHER, false, 0);
                  SwapPlan plan = SwapPlanner.planSwap(snapshot, true, true);

                  assertEquals(SwapPlan.Outcome.UNSAFE_CURSOR_OR_NO_SPACE, plan.outcome());
                  assertTrue(plan.steps().isEmpty());
              }

              @Test
              void testConfigPersistenceAndCorruptFileRecovery(@TempDir Path tempDir) throws IOException {
                  Path configFile = tempDir.resolve("totemsnap.json");
                  TotemSnapConfigManager manager = new TotemSnapConfigManager(configFile);

                  TotemSnapConfig initial = manager.load();
                  assertTrue(initial.isEnabled());
                  assertTrue(initial.isShowMissingTotemMessage());
                  assertEquals("key.keyboard.r", initial.getBoundKeyTranslationKey());

                  initial.setEnabled(false);
                  initial.setShowMissingTotemMessage(false);
                  initial.setBoundKeyTranslationKey("key.keyboard.v");
                  manager.updateAndSave(initial);

                  TotemSnapConfigManager reloadedManager = new TotemSnapConfigManager(configFile);
                  TotemSnapConfig reloaded = reloadedManager.load();
                  assertFalse(reloaded.isEnabled());
                  assertFalse(reloaded.isShowMissingTotemMessage());
                  assertEquals("key.keyboard.v", reloaded.getBoundKeyTranslationKey());

                  // Write corrupted JSON and verify safe default recovery
                  Files.writeString(configFile, "{ invalid_json: [1, 2", StandardCharsets.UTF_8);
                  TotemSnapConfig recovered = reloadedManager.load();
                  assertTrue(recovered.isEnabled());
                  assertTrue(recovered.isShowMissingTotemMessage());
                  assertEquals("key.keyboard.r", recovered.getBoundKeyTranslationKey());
              }
          }
          """)

